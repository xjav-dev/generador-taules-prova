name: Publica
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright axe-core
      - run: npx playwright install --with-deps chromium
      - run: npm run proves
      - run: sha256sum generador-taules-prova.html > generador-taules-prova.html.sha256
        working-directory: dist
      - run: |
          VERSIO="v$(node -p "require('./package.json').version")"
          gh release create "$VERSIO" dist/generador-taules-prova.html dist/generador-taules-prova.html.sha256 --target "$GITHUB_SHA" --title "$VERSIO" --notes "Baixa generador-taules-prova.html i obre'l amb doble clic. Consulta MANUAL.md."
        env:
          GH_TOKEN: ${{ github.token }}
