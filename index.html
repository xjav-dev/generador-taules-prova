<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-2hOD+WZBmRI9JBLKHqTWsRBcJ3F93xFnX0xiFvA16is='; style-src 'sha256-JNYoXaZPOBMoUhSwTEGvICj9kKRWSVg4fVRtwU3L3Rs='; worker-src blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Generador de taules de prova</title>
<style>:root {
  --paper: #eef1f6; --full: #ffffff; --tinta: #1a2238; --suau: #4f5a72; --reixa: #c9d1de;
  --marcador: #ffe873; --marcador-tinta: #1a2238; --accio: #1a2238; --accio-text: #ffffff; --malament: #a3211a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141a2b; --full: #1d2439; --tinta: #e9edf7; --suau: #aab4c9; --reixa: #39435c;
    --marcador: #f2d94e; --marcador-tinta: #141a2b; --accio: #e9edf7; --accio-text: #141a2b; --malament: #ff9c94;
  }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0 auto; padding: 28px 24px 48px; max-width: 1400px; color: var(--tinta); background: var(--paper); font: 16px/1.5 var(--sans); }
h1 { font: 600 2rem/1.2 var(--serif); margin: 0 0 4px; }
p { margin: 0 0 12px; max-width: 72ch; }
.avis-local { color: var(--suau); margin: 0 0 24px; }
.contingut:focus { outline: none; }
button.boto { font: inherit; padding: 9px 16px; border: 2px solid var(--accio); background: var(--accio); color: var(--accio-text); cursor: pointer; }
button.boto.secundari { background: transparent; color: var(--tinta); }
:is(button, input, select, summary):focus-visible { outline: 3px solid var(--marcador); outline-offset: 2px; box-shadow: 0 0 0 2px var(--tinta); }
input[type="text"], select { font: inherit; font-size: .875rem; padding: 3px 5px; width: 100%; border: 1px solid var(--suau); background: var(--full); color: var(--tinta); }
.error { color: var(--malament); font-weight: 600; }
.invisible { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

.zona { display: block; padding: 88px 24px; background: var(--full); border: 2px dashed var(--suau); text-align: center; cursor: pointer; font: 1.5rem var(--serif); }
.zona.actiu { background: var(--marcador); color: var(--marcador-tinta); border-style: solid; }
.zona:focus-within { outline: 3px solid var(--marcador); box-shadow: 0 0 0 2px var(--tinta); }
.zona small { display: block; margin-top: 8px; font: 1rem var(--sans); }
.explicacio { margin-top: 16px; color: var(--suau); }

.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
.barra .resum { flex: 1; min-width: 220px; max-width: none; margin: 0; font: 1.15rem var(--serif); }
.pestanyes { display: flex; flex-wrap: wrap; gap: 0; margin: 0; padding: 0; list-style: none; border-bottom: 2px solid var(--tinta); }
.pestanyes button { font: inherit; padding: 6px 14px; border: 0; background: none; color: var(--tinta); cursor: pointer; }
.pestanyes button[aria-pressed="true"] { background: var(--marcador); color: var(--marcador-tinta); font-weight: 600; }
.marc { overflow: auto; max-height: 68vh; background: var(--full); border: 1px solid var(--reixa); }
table { border-collapse: separate; border-spacing: 0; font-size: .875rem; white-space: nowrap; }
th, td { padding: 4px 9px; border-right: 1px solid var(--reixa); border-bottom: 1px solid var(--reixa); text-align: left; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
thead th { position: sticky; top: 0; z-index: 1; min-width: 150px; padding: 7px; font-weight: 400; background: var(--paper); vertical-align: top; }
thead th input, thead th select { display: block; }
thead th input { font-weight: 600; margin-bottom: 4px; }
th.fora, td.fora { opacity: .5; }
.nota { color: var(--suau); font-size: .875rem; margin: 10px 0; }
details { margin-top: 16px; max-width: 80ch; }
summary { cursor: pointer; font-weight: 600; }
details ul { margin: 8px 0; padding-left: 20px; }
.ocupat { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--accio); color: var(--accio-text); }
.ocupat p { margin: 0; }
.ocupat progress { flex: 1; }
.peu { margin-top: 32px; color: var(--suau); font-size: .875rem; }
</style>
</head>
<body>
<header class="capcalera">
  <h1 data-text="titol"></h1>
  <p class="avis-local" data-text="avisLocal"></p>
</header>
<main id="contingut" class="contingut" tabindex="-1"></main>
<div id="ocupat" class="ocupat" role="status" hidden>
  <p id="ocupat-text"></p>
  <progress></progress>
</div>

      el('input', {
        type: 'text', value: columna.titol, 'aria-label': UI.titolColumna + ' ' + (c + 1), 'data-control': 'titol-' + c,
        onchange: function (e) { if (e.target.value.trim()) aplicaCanvi(c, { titol: e.target.value.trim() }, 'titol'); else e.target.value = columna.titol; }
      }),
      el('select', {
        'aria-label': UI.tipusColumna + ' ' + (c + 1), 'data-control': 'tipus-' + c,
        onchange: function (e) { aplicaCanvi(c, { tipus: e.target.value }, 'tipus'); }
      }, Object.keys(UI.tipus).map(function (t) { return el('option', { value: t, text: UI.tipus[t], selected: columna.tipus === t }); }))
    ]);
  }

  function llistaCopiats(etiqueta, valors) {
    return el('p', { text: etiqueta + ': ' + (valors.length ? valors.join(', ') : UI.cap) });
  }

  function baixa() {
    motor('exporta').then(function (r) {
      var url = URL.createObjectURL(new Blob([r.fitxer.bytes], { type: r.fitxer.mime }));
      var enllac = el('a', { href: url, download: r.fitxer.nom });
      document.body.appendChild(enllac);
      enllac.click();
      enllac.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    }).catch(mostraError);
  }

  function pintaResultat() {
    var full = resultat.fulls[pestanya];
    var visibles = full.columnes.filter(function (c) { return c.tipus !== 'eliminar'; }).length;
    var barra = el('div', { class: 'barra' }, [
      el('p', { class: 'resum', text: UI.resum(full.numFiles, visibles) }),
      el('button', { type: 'button', class: 'boto', text: UI.baixa, onclick: baixa }),
      el('button', { type: 'button', class: 'boto secundari', text: UI.generaTot, onclick: function () {
        motor('regeneraTot').then(function (r) { resultat = r; pintaResultat(); }).catch(mostraError);
      } }),
      el('button', { type: 'button', class: 'boto secundari', text: UI.carrega, onclick: function () {
        motor('tanca').finally(function () { resultat = null; pintaInici(); });
      } })
    ]);
    var pestanyes = resultat.fulls.length > 1 ? el('ul', { class: 'pestanyes' }, resultat.fulls.map(function (f, i) {
      return el('li', {}, [el('button', { type: 'button', text: f.nom, 'aria-pressed': String(i === pestanya), onclick: function () { pestanya = i; pintaResultat(); } })]);
    })) : null;
    var taula = el('table', {}, [
      el('thead', {}, [el('tr', {}, full.columnes.map(capcaleraColumna))]),
      el('tbody', {}, full.files.map(function (fila) {
        return el('tr', {}, fila.map(function (valor, c) { return el('td', { text: valor, title: valor || null, class: full.columnes[c].tipus === 'eliminar' ? 'fora' : null }); }));
      }))
    ]);
    var copiats = el('details', {}, [
      el('summary', { text: UI.copiats }),
      el('p', { class: 'nota', text: UI.copiatsAvis }),
      llistaCopiats(UI.pestanyes, resultat.copiats.pestanyes),
      llistaCopiats(UI.titols, resultat.copiats.titols),
      llistaCopiats(UI.categories, resultat.copiats.categories)
    ]);
    contingut.replaceChildren.apply(contingut, [barra, el('p', { class: 'error', role: 'alert' }), pestanyes, el('div', { class: 'marc', tabindex: '0', role: 'region', 'aria-label': full.nom }, [taula]),
      el('p', { class: 'nota', text: UI.vista(full.files.length, full.numFiles) }), copiats].filter(Boolean));
  }

  ['dragover', 'drop'].forEach(function (nom) { document.addEventListener(nom, function (e) { e.preventDefault(); }); });
  document.querySelectorAll('[data-text]').forEach(function (element) { element.textContent = TEXTOS[element.getAttribute('data-text')]; });
  document.getElementById('versio').textContent = TEXTOS.versio + ' ' + VERSIO;
  canal = creaCanal();
  pintaInici();
}());
</script>
</body>
</html>
